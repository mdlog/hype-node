[project]
name = "hypenode-agent"
version = "0.1.0"
description = "LangGraph + MCP agent service for HypeNode Autonomous Indexer"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "langgraph>=0.2",
  "langchain-anthropic>=0.3",
  "langchain-core>=0.3",
  "mcp>=1.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
